<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3b2150">
<title>绒绒时装屋 · 毛茸茸换装游戏</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
/*__CSS__*/
</style>
</head>
<body>
<div class="app" id="app">
  <header class="bar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17" fill="#ffd56b"/><circle cx="20" cy="20" r="12.5" fill="none" stroke="#3b2150" stroke-width="2" stroke-dasharray="3 3"/><circle cx="15" cy="16" r="2.4" fill="#3b2150"/><circle cx="25" cy="16" r="2.4" fill="#3b2150"/><circle cx="15" cy="24" r="2.4" fill="#3b2150"/><circle cx="25" cy="24" r="2.4" fill="#3b2150"/></svg>
      <h1 id="brandTitle">绒绒时装屋</h1>
      <div class="quest" id="quest" hidden><span class="q-ico" data-ico="trophy"></span><b id="questTitle"></b><button class="q-x" id="btnQuit" aria-label="退出挑战">×</button></div>
    </div>
    <div class="bar-actions">
      <button class="ibtn" id="btnUndo" title="撤销" aria-label="撤销"></button>
      <button class="ibtn" id="btnRandom" title="随机搭配" aria-label="随机搭配"></button>
      <button class="ibtn" id="btnSound" title="音效" aria-label="音效开关"></button>
      <button class="ibtn accent" id="btnPhoto" title="拍照" aria-label="拍照保存"></button>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="scene-wrap" id="sceneWrap"></div>
    <div class="podium" aria-hidden="true"></div>
    <div class="char-wrap" id="charWrap"></div>
    <div class="fx" id="fx" aria-hidden="true"></div>
    <div class="curtain" id="curtain" aria-hidden="true"><i class="cl"></i><i class="cr"></i><b class="valance"></b></div>
    <div class="stage-ui">
      <button class="corner" id="btnPresets"><span class="c-ico" data-ico="sparkle"></span><span class="c-lb">穿搭灵感</span></button>
      <button class="corner hot" id="btnChallenge"><span class="c-ico" data-ico="trophy"></span><span class="c-lb" id="chLabel">主题挑战</span></button>
    </div>
  </main>

  <section class="drawer" id="drawer">
    <button class="handle" id="handle" aria-label="收起或展开衣橱"><span></span></button>
    <nav class="groups" id="groups" role="tablist"></nav>
    <nav class="cats" id="cats" role="tablist"></nav>
    <div class="items" id="items" role="listbox"></div>
    <div class="editor" id="editor"></div>
  </section>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-card" id="modalCard" role="dialog" aria-modal="true"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/*__JS__*/
</script>
</body>
</html>
