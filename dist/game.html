<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3b2150">
<title>绒绒时装屋 · 毛茸茸换装游戏</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --ink:#3b2150; --ink-2:#6d5285; --paper:#fffaf3; --paper-2:#f6eee2;
  --felt:#cdeee1; --felt-2:#b2e0cf; --felt-3:#93d1bb;
  --cherry:#ee4a72; --cherry-2:#c9325a; --butter:#ffd56b; --lilac:#e7ddff;
  --line:rgba(59,33,80,.16);
  --font:"ZCOOL KuaiLe","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --ui:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --drawer-h: clamp(300px, 43dvh, 400px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#2b1a3a;color:var(--ink);font-family:var(--ui);-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--butter);outline-offset:2px}

.app{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;height:100vh;height:100dvh;max-width:1440px;margin:0 auto;background:var(--ink);overflow:hidden;position:relative}

/* ---------- header ---------- */
.bar{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));background:var(--ink);color:var(--paper);position:relative;z-index:3}
.bar::after{content:"";position:absolute;left:10px;right:10px;bottom:3px;border-bottom:2px dashed rgba(255,213,107,.55)}
.brand{display:flex;align-items:center;gap:8px}
.brand-mark{width:30px;height:30px;flex:none}
.brand h1{font-family:var(--font);font-weight:400;font-size:22px;letter-spacing:1px;margin:0;color:var(--butter);white-space:nowrap}
.bar-actions{display:flex;gap:8px;flex:none}
.brand{min-width:0;flex:1 1 auto;margin-right:8px}
.quest{min-width:0}
.brand:has(.quest:not([hidden])) .brand-mark{display:none}
/* longer names in other languages: smaller, up to two tight lines */
html[lang=ko] .brand h1,html[lang=ko] .quest b,html[lang=ko] .tag .nm,html[lang=ko] .modal-card{word-break:keep-all}
html:not([lang|=zh]) .quest b{font-size:13px;line-height:1.05;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
html:not([lang|=zh]) .brand h1{font-size:17px;line-height:1.02;letter-spacing:0;white-space:normal}
.ibtn{width:38px;height:38px;border-radius:50%;background:var(--paper);color:var(--ink);display:grid;place-items:center;box-shadow:0 3px 0 rgba(0,0,0,.25);transition:transform .15s}
.ibtn svg{width:21px;height:21px}
.ibtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.ibtn.accent{background:var(--butter)}
.ibtn[disabled]{opacity:.45;cursor:default}

/* ---------- stage ---------- */
.stage{position:relative;overflow:hidden;min-height:0;min-width:0;isolation:isolate}
.scene-wrap{position:absolute;inset:0;z-index:0}
.scene-wrap svg{width:100%;height:100%;display:block}
.podium{position:absolute;left:50%;bottom:10px;width:min(54%,300px);aspect-ratio:5/1;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(43,20,60,.32),rgba(43,20,60,0));z-index:1}
.char-wrap{position:absolute;left:50%;bottom:18px;height:calc(97% - 18px);aspect-ratio:400/720;transform:translateX(-50%);z-index:2;transform-origin:50% 100%}
.char-wrap svg{width:100%;height:100%;display:block;overflow:visible}
.char-wrap.bounce{animation:bounce .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes bounce{0%{transform:translateX(-50%) scale(1,1)}30%{transform:translateX(-50%) scale(1.035,.965)}60%{transform:translateX(-50%) scale(.985,1.02)}100%{transform:translateX(-50%) scale(1,1)}}
.fx{position:absolute;inset:0;pointer-events:none;z-index:4}
.spark{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;animation:spark .8s ease-out forwards}
@keyframes spark{0%{transform:translate(0,0) scale(.2) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1) rotate(160deg);opacity:0}}

/* opening curtain (first load) */
.curtain{position:absolute;inset:0;z-index:8;pointer-events:none;overflow:hidden}
.curtain i{position:absolute;top:0;bottom:0;width:51%;background:repeating-linear-gradient(90deg,#8a1f3d 0 18px,#a4284b 18px 30px,#7a1a36 30px 42px);box-shadow:inset 0 -30px 40px rgba(0,0,0,.25);transition:transform 1.1s cubic-bezier(.6,0,.2,1)}
.curtain .cl{left:0;border-right:3px solid #f2c75c}
.curtain .cr{right:0;border-left:3px solid #f2c75c}
.curtain .valance{position:absolute;left:0;right:0;top:0;height:30px;background:radial-gradient(circle at 15px 0,#8a1f3d 15px,transparent 16px) 0 0/30px 30px repeat-x;border-top:8px solid #8a1f3d;transition:transform .8s .5s ease-in}
.curtain.open .cl{transform:translateX(-102%)}
.curtain.open .cr{transform:translateX(102%)}
.curtain.open .valance{transform:translateY(-110%)}
.curtain.gone{display:none}

/* character idle life */
.char .tail{animation:sway 3.4s ease-in-out infinite;transform-box:view-box}
.char .earL{animation:twitchL 6s ease-in-out infinite;transform-box:view-box}
.char .earR{animation:twitchR 7.5s ease-in-out infinite 1.2s;transform-box:view-box}
.char .eye{animation:blink 4.6s infinite;transform-box:fill-box;transform-origin:center}
.char .headgrp{animation:bob 3.4s ease-in-out infinite;transform-box:view-box;transform-origin:200px 300px}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg)}}
@keyframes twitchL{0%,86%,100%{transform:rotate(0)}89%{transform:rotate(-9deg)}92%{transform:rotate(2deg)}}
@keyframes twitchR{0%,88%,100%{transform:rotate(0)}91%{transform:rotate(9deg)}94%{transform:rotate(-2deg)}}
@keyframes blink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.08)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(1.6px)}}
.scene .tw{animation:tw 2.6s ease-in-out infinite}
.scene .flt{animation:flt 6s ease-in-out infinite;transform-box:fill-box}
.scene .fall{animation:fall 9s linear infinite}
.scene .drift{animation:drift 14s ease-in-out infinite alternate}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes flt{0%,100%{transform:translate(0,0)}50%{transform:translate(6px,-12px)}}
@keyframes fall{0%{transform:translate(0,-520px)}100%{transform:translate(30px,40px)}}
@keyframes drift{0%{transform:translateX(-14px)}100%{transform:translateX(14px)}}

.stage-ui{position:absolute;left:8px;right:8px;bottom:26px;display:flex;justify-content:space-between;align-items:flex-end;z-index:5;pointer-events:none}
.corner{pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:3px;transition:transform .15s}
.corner:active{transform:scale(.94)}
.c-ico{width:50px;height:50px;border-radius:50%;background:var(--paper);display:grid;place-items:center;box-shadow:0 3px 0 rgba(59,33,80,.3),0 6px 16px rgba(59,33,80,.2);position:relative}
.c-ico::after{content:"";position:absolute;inset:4px;border-radius:50%;border:1.5px dashed rgba(59,33,80,.3)}
.c-ico svg{width:24px;height:24px}
.corner.hot .c-ico{background:var(--cherry);color:#fff}
.corner.hot .c-ico::after{border-color:rgba(255,255,255,.6)}
.corner.go .c-ico{background:var(--butter);color:var(--ink);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 3px 0 rgba(59,33,80,.3),0 0 0 0 rgba(255,213,107,.7)}50%{box-shadow:0 3px 0 rgba(59,33,80,.3),0 0 0 10px rgba(255,213,107,0)}}
.c-lb{font-family:var(--font);font-size:13px;color:var(--ink);background:rgba(255,250,243,.92);padding:1px 8px;border-radius:999px;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--font);font-size:15px;padding:8px 16px;border-radius:999px;background:var(--paper-2);color:var(--ink);box-shadow:0 3px 0 rgba(59,33,80,.22);position:relative;transition:transform .15s}
.pill::after{content:"";position:absolute;inset:3px;border-radius:999px;border:1.5px dashed rgba(59,33,80,.25);pointer-events:none}
.pill.cherry{background:var(--cherry);color:#fff;box-shadow:0 3px 0 var(--cherry-2)}
.pill.cherry::after{border-color:rgba(255,255,255,.55)}
.pill:active{transform:translateY(2px)}
.quest{display:flex;align-items:center;gap:6px;background:var(--butter);color:var(--ink);border-radius:999px;padding:4px 4px 4px 10px;max-width:56vw;animation:drop .45s cubic-bezier(.3,1.5,.5,1)}
.quest[hidden]{display:none}
.quest b{font-family:var(--font);font-weight:400;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-ico{width:18px;height:18px;flex:none}.q-ico svg{width:18px;height:18px}
.q-x{width:24px;height:24px;border-radius:50%;background:rgba(59,33,80,.12);font-size:16px;line-height:1;flex:none}
@keyframes drop{from{transform:translateY(-40px);opacity:0}to{transform:none;opacity:1}}

/* ---------- drawer (felt fabric) ---------- */
.drawer{position:relative;min-width:0;height:var(--drawer-h);display:flex;flex-direction:column;background-color:var(--felt);background-image:radial-gradient(rgba(255,255,255,.55) 1px,transparent 1.3px),radial-gradient(rgba(59,33,80,.06) 1px,transparent 1.3px);background-size:9px 9px,9px 9px;background-position:0 0,4.5px 4.5px;border-radius:22px 22px 0 0;margin-top:-18px;z-index:7;padding-bottom:env(safe-area-inset-bottom);transition:height .35s cubic-bezier(.3,1.2,.5,1);box-shadow:0 -6px 18px rgba(30,10,40,.25)}
.drawer::before{content:"";position:absolute;inset:7px 7px 0;border:2px dashed rgba(255,255,255,.8);border-bottom:0;border-radius:16px 16px 0 0;pointer-events:none}
.drawer.collapsed{height:118px}
.drawer.collapsed .items,.drawer.collapsed .editor{display:none}
.handle{display:block;margin:6px auto 0;width:64px;height:16px;position:relative;z-index:1}
.handle span{display:block;width:42px;height:5px;border-radius:5px;background:rgba(59,33,80,.35);margin:0 auto}

.groups{display:flex;gap:6px;padding:4px 14px 0;position:relative;z-index:1}
.group{flex:1;font-family:var(--font);font-size:16px;padding:7px 0 6px;border-radius:12px 12px 4px 4px;background:rgba(255,255,255,.45);color:var(--ink-2);position:relative;transition:background .2s,color .2s}
.group[aria-selected="true"]{background:var(--ink);color:var(--butter)}
.group[aria-selected="true"]::after{content:"";position:absolute;inset:3px;border:1.5px dashed rgba(255,213,107,.6);border-radius:9px 9px 3px 3px}

.cats{display:flex;gap:6px;overflow-x:auto;padding:8px 14px 6px;scrollbar-width:none;position:relative;z-index:1;flex:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;display:flex;align-items:center;gap:4px;padding:5px 11px 5px 7px;border-radius:999px;background:var(--paper);font-size:13.5px;color:var(--ink);box-shadow:0 2px 0 rgba(59,33,80,.16);white-space:nowrap;transition:transform .15s,background .15s}
.cat svg{width:18px;height:18px;flex:none}
.cat[aria-selected="true"]{background:var(--cherry);color:#fff;box-shadow:0 2px 0 var(--cherry-2)}
.cat .dot{width:6px;height:6px;border-radius:50%;background:var(--cherry);margin-left:2px}
.cat[aria-selected="true"] .dot{background:#fff}

/* hang-tag item tiles */
.items{flex:1;min-height:0;display:grid;grid-auto-flow:column;grid-template-rows:minmax(0,1fr);grid-auto-columns:minmax(88px,26vw);gap:8px 8px;overflow-x:auto;overflow-y:hidden;padding:6px 14px 4px;scroll-snap-type:x proximity;scroll-padding:0 14px;position:relative;z-index:1;scrollbar-width:thin}
.tag{scroll-snap-align:start;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;background:var(--paper);border-radius:10px 10px 12px 12px;padding:12px 4px 4px;box-shadow:0 3px 0 rgba(59,33,80,.14);transition:transform .18s cubic-bezier(.3,1.5,.5,1),box-shadow .18s;min-height:0;overflow:hidden}
.tag::before{content:"";position:absolute;top:4px;left:50%;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:var(--felt);box-shadow:inset 0 1px 2px rgba(59,33,80,.35),0 0 0 2px #e4c27a}
.tag .th{flex:1;min-height:0;width:100%;position:relative}
.tag .th>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.tag.none .th{display:grid;place-items:center}
.tag .nm{font-size:11.5px;line-height:1.25;color:var(--ink);text-align:center;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:1px 2px 0}
.tag:hover{transform:translateY(-2px)}
.tag[aria-selected="true"]{box-shadow:0 0 0 3px var(--cherry),0 4px 0 var(--cherry-2);transform:translateY(-3px)}
html:not([lang|=zh]) .tag .nm{font-size:11px;line-height:1.1;white-space:normal;overflow-wrap:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tag[aria-selected="true"] .nm{color:var(--cherry-2)}
.tag.none .th{color:var(--ink-2);font-size:13px}
.tag.off .th{opacity:.38;filter:grayscale(.75)}
.tag.off .nm{color:var(--ink-2)}
.tag.off:hover{transform:none}
.ed-hint{flex:1;font-family:var(--font);font-size:14px;color:var(--ink-2)}
.tag.none .th span{width:44px;height:44px;border-radius:50%;border:2px dashed rgba(59,33,80,.3);display:grid;place-items:center}
.tag .swatch3{width:46px;height:46px;border-radius:50%;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;box-shadow:inset 0 0 0 2px rgba(59,33,80,.15)}

/* editor: thread spools + fabric swatches */
.editor{flex:none;padding:2px 14px 10px;position:relative;z-index:1}
.editor:empty{display:none}
.ed-row{display:flex;align-items:center;gap:8px;min-height:44px}
.ed-label{flex:none;font-family:var(--font);font-size:14px;color:var(--ink);min-width:2.6em}
.seg{display:flex;flex:none;background:rgba(255,255,255,.55);border-radius:999px;padding:2px}
.seg button{font-size:12.5px;padding:4px 10px;border-radius:999px;color:var(--ink-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--butter)}
.spools,.fabrics{display:flex;gap:7px;overflow-x:auto;padding:6px 2px 4px;scrollbar-width:none;flex:1;min-width:0}
.spools::-webkit-scrollbar,.fabrics::-webkit-scrollbar{display:none}
.spool{flex:none;width:26px;height:38px;position:relative;transition:transform .18s cubic-bezier(.3,1.6,.5,1)}
.spool svg{width:100%;height:100%;display:block}
.spool[aria-pressed="true"]{transform:translateY(-5px)}
.spool[aria-pressed="true"]::after{content:"";position:absolute;left:50%;bottom:-5px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--cherry)}
.spool.custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.fabric{flex:none;width:40px;height:40px;position:relative;transition:transform .18s cubic-bezier(.3,1.6,.5,1);filter:drop-shadow(0 2px 0 rgba(59,33,80,.18))}
.fabric svg{width:100%;height:100%;display:block}
.fabric[aria-pressed="true"]{transform:translateY(-4px) rotate(-4deg);filter:drop-shadow(0 0 0 var(--cherry)) drop-shadow(0 3px 0 var(--cherry-2))}
.toggle{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);white-space:nowrap;flex:none}
.toggle i{width:34px;height:20px;border-radius:20px;background:rgba(59,33,80,.25);position:relative;transition:background .2s}
.toggle i::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle[aria-pressed="true"] i{background:var(--cherry)}
.toggle[aria-pressed="true"] i::after{transform:translateX(14px)}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(32,14,44,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:14px;animation:fade .2s}
.modal[hidden]{display:none}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal-card{width:min(560px,100%);max-height:calc(100dvh - 28px);overflow:auto;background:var(--paper);border-radius:22px;padding:18px 18px 16px;position:relative;box-shadow:0 10px 0 rgba(59,33,80,.25);animation:pop .35s cubic-bezier(.3,1.5,.5,1)}
.modal-card::before{content:"";position:absolute;inset:7px;border:2px dashed rgba(59,33,80,.18);border-radius:16px;pointer-events:none}
@keyframes pop{from{transform:scale(.85) translateY(20px);opacity:0}to{transform:none;opacity:1}}
.m-close{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;background:var(--paper-2);font-size:20px;z-index:2}
.m-title{font-family:var(--font);font-weight:400;font-size:24px;margin:2px 0 4px;text-align:center}
.m-sub{font-size:13.5px;color:var(--ink-2);text-align:center;margin:0 0 12px;line-height:1.5}
.m-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}

.preset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.preset{background:#fff;border-radius:14px;padding:6px 6px 8px;box-shadow:0 3px 0 rgba(59,33,80,.14);display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .15s}
.preset:active{transform:scale(.97)}
.preset .pv{width:100%;aspect-ratio:3/4;border-radius:10px;overflow:hidden;position:relative}
.preset .pv>svg{position:absolute;inset:0;width:100%;height:100%}
.preset b{font-family:var(--font);font-weight:400;font-size:15px}
.preset small{font-size:11px;color:var(--ink-2)}

.theme-card{border-radius:18px;padding:16px;background:linear-gradient(160deg,#fff,#f9f1ff);text-align:center;box-shadow:inset 0 0 0 2px rgba(59,33,80,.08)}
.theme-card .tt{font-family:var(--font);font-size:30px;margin:2px 0 6px}
.theme-card p{margin:0;font-size:14px;line-height:1.6;color:var(--ink-2)}
.chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.chip{font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--lilac);color:var(--ink)}
.chip.scene{background:#d9f2ea}

.judges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 10px}
.judge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.judge .av{width:84px;height:84px;border-radius:50%;background:#fff;overflow:hidden;box-shadow:inset 0 0 0 3px var(--felt-2)}
.judge .av svg{width:100%;height:100%}
.judge b{font-size:12.5px;font-weight:600}
.judge .sc{font-family:var(--font);font-size:26px;color:var(--cherry)}
.judge q{font-size:12px;color:var(--ink-2);line-height:1.4;quotes:none}
.tape{position:relative;height:44px;border-radius:6px;background:var(--butter);box-shadow:inset 0 -3px 0 rgba(0,0,0,.08);overflow:hidden;margin:8px 0 4px}
.tape::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(59,33,80,.55) 0 1px,transparent 1px 10%),repeating-linear-gradient(90deg,rgba(59,33,80,.35) 0 1px,transparent 1px 2%);-webkit-mask:linear-gradient(#000 0 0) top/100% 14px no-repeat;mask:linear-gradient(#000 0 0) top/100% 14px no-repeat}
.tape .nums{position:absolute;left:0;right:0;bottom:4px;display:flex;justify-content:space-between;font-size:10px;color:var(--ink);padding:0 2px}
.tape .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,rgba(238,74,114,.25),rgba(238,74,114,.55));transition:width 1.4s cubic-bezier(.2,.9,.3,1)}
.tape .pin{position:absolute;top:-2px;width:4px;bottom:-2px;background:var(--cherry);left:0;transition:left 1.4s cubic-bezier(.2,.9,.3,1);border-radius:2px}
.score-big{text-align:center;font-family:var(--font);font-size:44px;line-height:1;margin-top:4px}
.score-big small{font-size:18px;color:var(--ink-2)}
.grade{display:inline-block;font-family:var(--font);font-size:18px;padding:4px 14px;border-radius:999px;background:var(--ink);color:var(--butter);transform:rotate(-3deg);margin-top:6px}
.stars{display:flex;justify-content:center;gap:4px;margin-top:8px}
.stars svg{width:28px;height:28px}
.stars .on{animation:starpop .45s cubic-bezier(.3,1.8,.5,1) both}
@keyframes starpop{from{transform:scale(0) rotate(-40deg)}to{transform:none}}
.tips{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:#f3fbf7;font-size:13px;line-height:1.6;color:var(--ink)}

.photo-wrap{display:grid;place-items:center}

<script>
/* ---- util.js ---- */
/* ===== util.js — geometry, color and SVG helpers (pure, no DOM) ===== */
const CX = 200;
const r1 = n => Math.round(n * 10) / 10;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;

/* ---------- color ---------- */
function hex2rgb(h) {

function rgb2hex(r, g, b) {

}
function rgb2hsl(r, g, b) {

}
function hsl2rgb(h, s, l) {

  const c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = l - c / 2;

  if (h < 60) { r = c; g = x; } else if (h < 120) { r = x; g = c; } else if (h < 180) { g = c; b = x; }
  else if (h < 240) { g = x; b = c; } else if (h < 300) { r = x; b = c; } else { r = c; b = x; }
  return [(r + m) * 255, (g + m) * 255, (b + m) * 255];
}
const toHsl = hex => rgb2hsl(...hex2rgb(hex));
const fromHsl = (h, s, l) => rgb2hex(...hsl2rgb(h, clamp(s, 0, 1), clamp(l, 0, 1)));
/* change lightness while keeping chroma (avoids pale colors turning neon when darkened) */
function withL(hex, l2, hueShift = 0, satMul = 1) {

/* a colour multiplied by another (正片叠底) */
function multiplyHex(a, b) { const A = hex2rgb(a), B = hex2rgb(b); return rgb2hex(A[0] * B[0] / 255, A[1] * B[1] / 255, A[2] * B[2] / 255); }

const INK_LINE = '#3b1a1f';
function lineOf(hex) {

/* ---------- points & paths ---------- */
const pt = a => Array.isArray(a) ? { x: a[0], y: a[1], c: !!a[2] } : a;
const mirX = x => 2 * CX - x;
const mirPt = p => ({ x: mirX(p.x), y: p.y, c: p.c });
function same(a, b) { return Math.abs(a.x - b.x) < 0.05 && Math.abs(a.y - b.y) < 0.05; }

/* Mirror a right-half contour (top -> right side -> bottom) into a full loop */
function sym(right) {
  const R = right.map(pt);
  const L = R.slice().reverse().map(mirPt);
  const out = R.slice();
  for (const q of L) if (!same(q, out[out.length - 1])) out.push(q);
  if (out.length > 2 && same(out[0], out[out.length - 1])) out.pop();
  return out;
}
/* Catmull-Rom -> cubic Bezier. Points flagged c=true are sharp corners. */
function smooth(points, closed = true, t = 1) {
  const P = points.map(pt), n = P.length;
  if (n < 2) return '';
  const get = i => closed ? P[(i + n) % n] : P[clamp(i, 0, n - 1)];
  let d = `M${r1(P[0].x)},${r1(P[0].y)}`;
  const segs = closed ? n : n - 1;
  for (let i = 0; i < segs; i++) {
    const p1 = get(i), p2 = get(i + 1);
    const a = (p1.c || (!closed && i === 0)) ? p1 : get(i - 1);

    const c2x = p2.x - (b.x - p1.x) / 6 * t, c2y = p2.y - (b.y - p1.y) / 6 * t;

const S = (right, t) => smooth(sym(right), true, t);         // symmetric closed shape
const poly = pts => 'M' + pts.map(p => { p = pt(p); return r1(p.x) + ',' + r1(p.y); }).join('L');
/* mirror / rotate a list of points */
const mirAll = pts => pts.map(p => mirPt(pt(p)));
function rot(pts, ang, ox = 0, oy = 0) {
  const c = Math.cos(ang), s = Math.sin(ang);
  return pts.map(p => { p = pt(p); const x = p.x - ox, y = p.y - oy; return { x: ox + x * c - y * s, y: oy + x * s + y * c, c: p.c }; });

/* ---------- spine sampling (for limbs, tails, hair strands) ---------- */
function bez(p0, p1, p2, p3, t) {
  const u = 1 - t;
  return { x: u * u * u * p0.x + 3 * u * u * t * p1.x + 3 * u * t * t * p2.x + t * t * t * p3.x,
           y: u * u * u * p0.y + 3 * u * u * t * p1.y + 3 * u * t * t * p2.y + t * t * t * p3.y };
}
/* sample a polyline with rounded joints into evenly spaced points */
function samplePolyline(pts, step = 7, round = 14) {
  const P = pts.map(pt);
  let path = [P[0]];
  for (let i = 1; i < P.length; i++) {
    const a = P[i - 1], b = P[i];
    if (i < P.length - 1) {
      const c = P[i + 1];
      const l1 = Math.hypot(b.x - a.x, b.y - a.y), l2 = Math.hypot(c.x - b.x, c.y - b.y);
      const r = Math.min(round, l1 / 3, l2 / 3);
      const pA = { x: b.x - (b.x - a.x) / l1 * r, y: b.y - (b.y - a.y) / l1 * r };
      const pB = { x: b.x + (c.x - b.x) / l2 * r, y: b.y + (c.y - b.y) / l2 * r };
      path.push(pA);
      for (let k = 1; k < 6; k++) {
        const t = k / 6, u = 1 - t;
        path.push({ x: u * u * pA.x + 2 * u * t * b.x + t * t * pB.x, y: u * u * pA.y + 2 * u * t * b.y + t * t * pB.y });
      }
      path.push(pB);
    } else path.push(b);
  }
  // resample by arc length
  const cum = [0];
  for (let i = 1; i < path.length; i++) cum.push(cum[i - 1] + Math.hypot(path[i].x - path[i - 1].x, path[i].y - path[i - 1].y));

  const n = Math.max(2, Math.ceil(L / step));

  for (let k = 0; k <= n; k++) {
    const s = L * k / n;
    while (j < cum.length - 1 && cum[j] < s) j++;
    const t = (s - cum[j - 1]) / ((cum[j] - cum[j - 1]) || 1);
    out.push({ x: lerp(path[j - 1].x, path[j].x, t), y: lerp(path[j - 1].y, path[j].y, t), s });

}
function sampleBezier(p0, p1, p2, p3, n = 24) {
  const raw = [];
  for (let i = 0; i <= 80; i++) raw.push(bez(pt(p0), pt(p1), pt(p2), pt(p3), i / 80));
  return resample(raw, n);
}
function resample(raw, n) {
  const cum = [0];
  for (let i = 1; i < raw.length; i++) cum.push(cum[i - 1] + Math.hypot(raw[i].x - raw[i - 1].x, raw[i].y - raw[i - 1].y));
  const L = cum[cum.length - 1], out = [];
  let j = 1;
  for (let k = 0; k <= n; k++) {
    const s = L * k / n;
    while (j < cum.length - 1 && cum[j] < s) j++;
    const t = (s - cum[j - 1]) / ((cum[j] - cum[j - 1]) || 1);
    out.push({ x: lerp(raw[j - 1].x, raw[j].x, t), y: lerp(raw[j - 1].y, raw[j].y, t), s });

/* normals for a sampled spine */
function normals(sp) {
  return sp.map((p, i) => {
    const a = sp[Math.max(0, i - 1)], b = sp[Math.min(sp.length - 1, i + 1)];
    const dx = b.x - a.x, dy = b.y - a.y, l = Math.hypot(dx, dy) || 1;
    return { x: -dy / l, y: dx / l, tx: dx / l, ty: dy / l };

}
/* segment intersection (proper crossing only) */
function segX(a, b, c, d) {
  const rx = b.x - a.x, ry = b.y - a.y, sx = d.x - c.x, sy = d.y - c.y;
  const den = rx * sy - ry * sx;
  if (Math.abs(den) < 1e-9) return null;
  const t = ((c.x - a.x) * sy - (c.y - a.y) * sx) / den, u = ((c.x - a.x) * ry - (c.y - a.y) * rx) / den;

/* cut the little loops an offset curve makes on the inside of a tight bend; the crossing becomes a sharp crease */
function deloop(P, win = 40) {
  const out = P.slice();

    for (let j = Math.min(out.length - 2, i + win); j > i + 1; j--) {
      const X = segX(out[i], out[i + 1], out[j], out[j + 1]);

    right.push({ x: sp[i].x - N[i].x * (w + fr), y: sp[i].y - N[i].y * (w + fr), c: fr > 0 });

/* 2-bone IK. bend: +1 / -1 picks elbow side. Returns elbow & (clamped) wrist */
function ik(S0, T, L1, L2, bend) {

/* ---------- SVG snippets ---------- */

  const xi = [K.gap, K.gap + 1 + (K.kc - K.kw - K.gap) * .32, K.kc - K.kw, K.cc - K.cw + 1, K.ac - K.aw];
  for (let i = 1; i < ys.length; i++) if (y <= ys[i]) { const t = (y - ys[i - 1]) / (ys[i] - ys[i - 1]); return { o: lerp(xo[i - 1], xo[i], t) + add, i: lerp(xi[i - 1], xi[i], t) - add * .5 }; }
  return { o: xo[4] + add, i: xi[4] - add * .5 };
}
function legPath(K, s, add, cut = 682) {
  const { outer, inner } = legPts(K, s, add);
  const X = dx => CX + s * dx;
  const pts = [[X(K.gap), 444, 1], ...outer, [outer[4][0], cut, 1], [inner[0][0], cut, 1], ...inner, [X(K.gap), Y.crotch, 1]];
  return smooth(pts);
}
/* region of one leg between y0 and y1 (used for socks); add = looseness */
function legBand(K, s, y0, y1, add = 1.2, topRound = 0) {
  const X = dx => CX + s * dx;
  const ys = [];
  for (let y = y0; y < y1; y += 14) ys.push(y);
  ys.push(y1);
  const out = ys.map(y => { const e = legEdgeAt(K, y, add); return [X(e.o), y]; });
  const inn = ys.slice().reverse().map(y => { const e = legEdgeAt(K, y, add); return [X(e.i), y]; });
  out[0][2] = 1; inn[inn.length - 1][2] = 1; out[out.length - 1][2] = 1; inn[0][2] = 1;
  if (topRound) { out[0][1] += topRound * 0.2; }
  return smooth([...out, ...inn]);
}

/* ---------- paws ---------- */
function footPts(K, s) {
  const X = dx => CX + s * dx;
  return [[X(K.ac - K.aw), 660], [X(K.ac + K.aw), 660], [X(K.ac + K.aw + 6), 678], [X(K.ac + K.aw + 9), 693], [X(K.ac + K.aw + 4), 704],
    [X(K.ac + 1), 707], [X(K.ac - K.aw - 5), 704], [X(K.ac - K.aw - 7), 692], [X(K.ac - K.aw - 4), 676]];
}
/* big round bare paw (reference style); returns outline + toe creases for one side */
function toonFoot(K, sd) {
  const X = dx => CX + sd * dx;
  const a = K.ac, w = K.aw;
  const d = smooth([[X(a - w + 1), 646], [X(a - w - 4), 666], [X(a - w - 9), 684], [X(a - w - 8), 700], [X(a - w - 2), 708], [X(a + 1), 710.5], [X(a + w + 4), 708],
    [X(a + w + 10), 699], [X(a + w + 11), 682], [X(a + w + 5), 664], [X(a + w - 1), 646]]);
  const toes = `M${X(a - 6)},709Q${X(a - 6.5)},701 ${X(a - 5.5)},693M${X(a + 7)},709Q${X(a + 7.5)},701 ${X(a + 6.5)},693`;
  return { d, toes };
}
function drawFeet(ctx, K, col) {
  const lc = lineOf(col);
  let s = '';
  for (const sd of [-1, 1]) {
    const X = dx => CX + sd * dx;
    s += flat(smooth(footPts(K, sd)), col, lc, 2.6);
    s += ln(`M${X(K.ac - 4)},706Q${X(K.ac - 4)},700 ${X(K.ac - 3)},696M${X(K.ac + 5)},706Q${X(K.ac + 6)},700 ${X(K.ac + 6)},696`, lc, 1.8, { opacity: .7 });
  }
  return s;
}
/* point where a held item attaches (center of the paw) */
function gripPoint(arm, K) {
  const r = K.arm + 1.6;
  return { x: arm.W.x + arm.dir.x * r * 1.05, y: arm.W.y + arm.dir.y * r * 1.05 };
}

/* ---------- one-piece arm: shoulder, upper arm, elbow, forearm, wrist and paw share a single outline ---------- */
/* fur half-width along the arm: starts slim (hidden in the shoulder), upper arm, slimmer elbow, forearm, wrist */
function armFurWidth(K) {
  const a = K.arm;
  return t => t < .5 ? lerp(a + .8, a - .9, t / .5)
      : t < .72 ? lerp(a - .9, a - .2, Math.sin((t - .5) / .22 * Math.PI / 2))
        : lerp(a - .2, a - 2.4, (t - .72) / .28);
}
/* paw outlines in the wrist frame for a right arm (x < 0 = thumb side for a fist), from the left
   wrist edge to the right one. u/v are in paw units; the first/last points are replaced by the wrist. */
const PAW_FIST = [[-1, 0], [-1, .2, 'w'], [-.98, .52], [-1.17, 1.0], [-1.06, 1.46], [-.8, 1.72, 1], [-.6, 1.96], [-.37, 2.1], [-.13, 2.1, 1], [.13, 2.18], [.4, 2.1, 1],
  [.66, 2.03], [.97, 1.72], [1.09, 1.2], [.98, .6], [1, .2, 'w'], [1, 0]];
const PAW_OPEN = [[-1, 0], [-1, .25, 'w'], [-1.15, 1.0], [-1.05, 1.75, 1], [-.62, 2.05], [-.3, 2.2, 1], [0, 2.28], [.3, 2.2, 1], [.62, 2.05], [1.05, 1.75, 1], [1.25, 1.1],
  [1.65, .55], [1.1, .25], [1, .1, 'w'], [1, 0]];
function armShape(arm, K) {
  if (arm._shape) return arm._shape;
  const sp = samplePolyline(arm.pts, 5, 12);
  const N = normals(sp), n = sp.length;
  const wf = armFurWidth(K);
  let L = [], Rt = [];
  for (let i = 0; i < n; i++) {
    const w = wf(i / (n - 1));
    L.push({ x: sp[i].x + N[i].x * w, y: sp[i].y + N[i].y * w });
    Rt.push({ x: sp[i].x - N[i].x * w, y: sp[i].y - N[i].y * w });
  }
  L = deloop(L); Rt = deloop(Rt);
  // wrist frame: x across (left edge = -ww), y along the forearm
  const W = sp[n - 1], d = { x: N[n - 1].tx, y: N[n - 1].ty }, ww = wf(1);
  const toS = (x, y) => ({ x: W.x + x * d.y + y * d.x, y: W.y - x * d.x + y * d.y });
  const open = arm.hand === 'open';
  const U = (K.arm + 1.6) * (open ? 1.18 : 1.2);
  const mir = arm.side < 0;
  const local = (pts) => {
    let q = pts.map(([u, v, c]) => {
      let x = c === 'w' ? Math.sign(u) * (ww + U * .07) : u * U;
      if (Math.abs(u) === 1 && v === 0 && c === undefined) x = Math.sign(u) * ww;
      return [x, v * U, c === 1];
    });
    if (mir) q = q.map(([x, y, c]) => [-x, y, c]).reverse();
    return q;
  };
  const paw = local(open ? PAW_OPEN : PAW_FIST).slice(1, -1).map(([x, y, c]) => Object.assign(toS(x, y), { c }));
  // shoulder: small round cap tucked inside the torso
  const w0 = wf(0), n0 = N[0], cap = [];
  for (let k = 1; k < 6; k++) { const a = Math.PI * k / 6; cap.push({ x: sp[0].x - n0.x * w0 * Math.cos(a) - n0.tx * w0 * Math.sin(a), y: sp[0].y - n0.y * w0 * Math.cos(a) - n0.ty * w0 * Math.sin(a) }); }
  const d0 = smooth([...L, ...paw, ...Rt.slice().reverse(), ...cap], true);
  // paw on its own (drawn again on top of held items / in front of the head): fill closes a little way up the forearm,
  // the outline only follows the paw contour
  const m = L.length - 1, mr = Rt.length - 1, back = Math.min(3, m, mr);
  const contour = [L[m], ...paw, Rt[mr]];
  // the closing points up the forearm are corners: smoothed, the fill bulged out past the forearm's outline at the wrist
  const corner = q => Object.assign({}, q, { c: true });
  const pawFill = smooth([corner(L[m - back]), corner(L[m]), ...paw, corner(Rt[mr]), corner(Rt[mr - back])], true);
  const pawLine = smooth(contour, false);
  const cx = contour.reduce((a, p) => a + p.x, 0) / contour.length, cy = contour.reduce((a, p) => a + p.y, 0) / contour.length;
  const grow = q => { const dx = q.x - cx, dy = q.y - cy, l = Math.hypot(dx, dy) || 1; return [q.x + dx / l * 5, q.y + dy / l * 5]; };
  const pawClip = poly([[L[m - back].x, L[m - back].y], ...contour.map(grow), [Rt[mr - back].x, Rt[mr - back].y]]) + 'Z';
  // paw details in screen space
  const P = (u, v) => { const x = (mir ? -u : u) * U; const p = toS(x, v * U); return `${r1(p.x)},${r1(p.y)}`; };
  let creases = '', pads = '';
  if (open) {
    const palm = [[-.45, .78], [0, .62], [.45, .78], [.32, 1.18], [0, 1.28], [-.32, 1.18]].map(([u, v]) => toS((mir ? -u : u) * U, v * U));
    pads = smooth(palm);
    pads = { palm: pads, toes: [[-.6, 1.62], [-.2, 1.8], [.2, 1.8], [.6, 1.62]].map(([u, v]) => toS((mir ? -u : u) * U, v * U)), r: U * .19 };
  } else {
    const cr = (a, b) => `M${P(a[0], a[1])}Q${P((a[0] + b[0]) / 2 + .05, (a[1] + b[1]) / 2)} ${P(b[0], b[1])}`;
    creases = cr([-.8, 1.72], [-.66, 1.22]) + cr([-.13, 2.1], [-.1, 1.56]) + cr([.4, 2.1], [.38, 1.58]);
  }
  return (arm._shape = { d: d0, sp, wf, U, creases, pads, pawFill, pawLine, pawClip });
}

/* ---------- arm & sleeve tubes ---------- */
function armWidth(K) { return t => lerp(K.arm + 0.6, K.arm - 2.3, t); }
/* tube along arm polyline from arc-length a to b. returns {d, open} (open = outline without the start edge) */
function armTube(arm, K, a, b, wf, capA = 'round', capB = 'round', flare = 0) {
  let pts = cutPolyline(arm.pts, Math.min(b, arm.len));
  if (a > 0.5) pts = cutPolyline(pts.slice().reverse(), plen(pts) - a).reverse();
  const sp = samplePolyline(pts, 6, 12);
  const width = t => {
    const tt = (a + t * sp.L) / arm.len;
    return wf(tt) + (flare && t > 0.55 ? flare * Math.pow((t - 0.55) / 0.45, 1.6) : 0);
  };
  return { d: tube(sp, width, capA, capB), open: tubeOpen(sp, width, capB), sp, width };
}

/* ---------- tails ---------- */
function tailAnchor(K) { return { x: CX - K.hi + 16, y: 462 }; }
function drawTail(ctx, st, F, K) {
  const sp = SPECIES[st.species];
  const A = tailAnchor(K);
  if (TOON_TAILS[sp.tail]) return drawToonTail(ctx, st, F, A);
  if (sp.tail === 'cat' || sp.tail === 'tiger') return drawToonLongTail(ctx, st, F, A);
  // short tails peek out beside the hip
  const lc = F.line;
  let s = '';
  switch (sp.tail) {
    case 'bunny': {
      const pts = []; for (let i = 0; i < 14; i++) { const a = i / 14 * Math.PI * 2, r = i % 2 ? 15 : 19; pts.push([-12 + Math.cos(a) * r, -2 + Math.sin(a) * r, i % 2 === 0]); }
      s += flat(smooth(pts), F.sub, lineOf(F.sub), 2.6);
      break;
    }
    case 'deer':
      s += flat(smooth([[0, -8], [-14, -10], [-24, 2], [-20, 16, 1], [-8, 8], [2, 6]]), F.main, lc, 2.6) + path(smooth([[-6, 0], [-18, 4], [-18, 12, 1], [-8, 6]]), { fill: F.sub });
      break;
    case 'bear': s += circ(-8, 0, 12, { fill: st.fur.panda ? F.acc : F.main, stroke: lc, 'stroke-width': 2.6 }); break;
  }
  return g(g(s, { transform: `translate(${A.x},${A.y})` }), { class: 'tail', style: `transform-origin:${A.x}px ${A.y}px` });

function drawTorso(ctx, st, F, K, lineMask) {

function drawLegs(ctx, st, F, K, bare = false) {

    const foot = bare ? toonFoot(K, sd) : null;
    let m = '';
    if (sp.stripes) for (const y of [540, 572, 604, 636]) { const e = legEdgeAt(K, y); const X = dx => CX + sd * dx; m += path(`M${X(e.o + 4)},${y - 6}L${X((e.o + e.i) / 2)},${y}L${X(e.o + 4)},${y + 6}Z`, { fill: F.acc }); }
    if (sp.paws) m += path(sockD(K, sd, 604), { fill: F.acc });
    if (foot) {
      const fid = ctx.shape(foot.d), fl = lineOf(F.foot);
      s += use(sid, { fill: 'none', stroke: F.limbLine, 'stroke-width': 5.4, 'stroke-linejoin': 'round' }) + use(fid, { fill: 'none', stroke: fl, 'stroke-width': 5.4, 'stroke-linejoin': 'round' })
        + g(use(sid, { fill: F.limb }) + m + rimShade(ctx, d), { 'clip-path': ctx.clipUse(sid) })
        + g(use(fid, { fill: F.foot }) + path(`M${CX + sd * K.ac + K.aw - 2},640L${CX + sd * K.ac + K.aw + 30},640L${CX + sd * K.ac + K.aw + 30},720L${CX + sd * K.ac + 3},720Z`, shadowFill(.12)), { 'clip-path': ctx.clipUse(fid) })
        + ln(foot.toes, fl, 2.1);
      continue;
    }
    s += g(use(sid, { fill: F.limb }) + m + rimShade(ctx, d), { 'clip-path': ctx.clipUse(sid) }) + use(sid, { fill: 'none', stroke: F.limbLine, 'stroke-width': 2.7, 'stroke-linejoin': 'round' });
  }
  return s;
}

/* ---------- fitting things to each species' head (hats, hair) ---------- */
const headKindOf = st => TOON_HEADS[st.species] ? st.species : 'fox';
/* x of the right side of the cranium at height y */
function craniumX(kind, y) {
  const R = TOON_HEADS[kind].right;
  if (y <= R[0][1]) return R[0][0];
  for (let i = 0; i < R.length - 1; i++) {
    const a = R[i], b = R[i + 1];
    if (a[1] <= y && b[1] >= y && b[1] > a[1]) return a[0] + (b[0] - a[0]) * (y - a[1]) / (b[1] - a[1]);
  }
  return R[R.length - 1][0];
}
/* cranium outline from the left side at y0, over the top, down to the right side at y0, pushed outwards by
   t (a number, or t(k) with k = 0 at y0 and 1 at the crown, so a hat can be fuller on top) */
function craniumArc(kind, y0, t) {
  const R = TOON_HEADS[kind].right, top = R[0][1] - .8;
  const right = [];
  for (const p of R) { if (p[1] >= y0) break; right.push({ x: p[0], y: p[1] }); }
  right.push({ x: craniumX(kind, y0), y: y0 });
  const P = [...right.map(p => ({ x: 400 - p.x, y: p.y })).reverse(), { x: 200, y: top }, ...right];
  const N = normals(P);
  return P.map((p, i) => {
    let nx = N[i].x, ny = N[i].y;
    if (nx * (p.x - 200) + ny * (p.y - y0 - 30) < 0) { nx = -nx; ny = -ny; }
    const k = clamp((y0 - p.y) / (y0 - top), 0, 1), d = typeof t === 'function' ? t(k) : t;
    return [r1(p.x + nx * d), r1(p.y + ny * d)];
  });
}
/* the skull without its cheek fluff: below the temples the head side is held at the temple width, then follows the jaw */
function skullX(kind, y) {
  const top = craniumX(kind, Math.min(y, 200));
  return y <= 200 ? top : Math.min(craniumX(kind, y), top + 4);
}

function toonHeadPts(kind, tuft) {
  const H = TOON_HEADS[kind] || TOON_HEADS.fox;
  const R = H.right;
  const left = mirList(R.slice(1, -1)).reverse();
  return [...(tuft || H.tuft), ...R, ...left];
}
const TOON_CACHE = {};
function toonHeadPath(kind, tuftId, tuft) {
  const k = kind + ':' + (tuftId || '');
  return TOON_CACHE[k] || (TOON_CACHE[k] = smooth(toonHeadPts(kind, tuft)));
}

function drawToonHead(ctx, st, F) {
  const sp = SPECIES[st.species];
  const kind = TOON_HEADS[st.species] ? st.species : 'fox';
  const tuft = toonTuft(st, kind);
  const d = toonHeadPath(kind, tuft.id, tuft.pts);
  const sid = ctx.shape(d);
  let m = TOON_FACE[kind] ? TOON_FACE[kind](ctx, st, F) : '';
  // hard shadow along the jaw
  m += path(S([[200, 276], [228, 274], [258, 270], [282, 260], [300, 254], [340, 262], [340, 330], [200, 330]]), shadowFill(.08));
  let s = g(use(sid, { fill: F.main }) + m, { 'clip-path': ctx.clipUse(sid) });
  s += use(sid, { fill: 'none', stroke: F.line, 'stroke-width': 2.7, 'stroke-linejoin': 'round' });
  // little fur flicks on spiky cheeks; whiskers
  if (['fox', 'wolf', 'tiger'].includes(kind)) s += ln('M276,248l14,3M124,248l-14,3', F.line, 1.6, { opacity: .5 });
  if (sp.whiskers) {
    const wc = isLight(F.sub) ? F.line : lighten(F.sub, .4);

    for (const s2 of [-1, 1]) {

    }
    s += ln(w, wc, 1.3, { opacity: .55 });

  return s + (tuft.over ? tuft.over(ctx, st, F, sid) : '');
}
/* tuft on top of the head: the species default, or a fur-tuft style the player picked (see hair.js) */
function toonTuft(st, kind) {
  const hat = st.wear && st.wear.hat && ITEM_INDEX.hat[st.wear.hat.id];
  if (hat && hat.covers) return { id: '_hat', pts: [], over: null };   // no top tuft under a hat
  if (st.hair && HAIR_STYLES[st.hair.id]) return { id: '_hat', pts: [], over: null };   // the hairstyle covers the top of the head
  return { id: '', pts: null, over: null };
}

function drawToonEars(ctx, st, F) {
  const sp = SPECIES[st.species], pal = st.fur;
  const key = TOON_EARS[st.species] ? st.species : 'fox';
  const E = TOON_EARS[key];
  const sid = ctx.shape(smooth(E.outline));
  const lc = F.line;
  const earCol = pal.panda || pal.points ? F.acc : F.main;
  const innerCol = pal.panda ? lighten(F.acc, .14) : F.inner;
  let inner = E.cap ? path(poly(E.cap) + 'Z', { fill: F.acc }) : '';
  inner += path(smooth(E.inner), { fill: innerCol });
  if (E.fluff) inner += ln(smooth(E.fluff, false), isLight(innerCol) ? mix(innerCol, INK, .42) : lighten(innerCol, .35), 1.5, { opacity: .8 });
  if (E.fold) inner += ln(smooth(E.fold, false), lc, 2);
  const [px, py] = E.pivot, k = E.scale || 1;

    { transform: `translate(${px},${py}) scale(${k}) translate(${-px},${-py})` });
  let s = g(one, { class: 'ear earR', style: `transform-origin:${px}px ${py}px` })
    + g(g(one, { transform: `translate(${2 * CX},0) scale(-1,1)` }), { class: 'ear earL', style: `transform-origin:${mirX(px)}px ${py}px` });
  if (sp.antlers) s = toonAntlers(F) + s;

/* ---- hair.js ---- */
/* ===== hair.js — 前发 / 后发 (front hair and back hair) =====
   前发 (front hair): '天然' keeps the species' own little tuft; the six short styles are traced from the hairstyle
   reference sheet (hair_data.js) on the fox head and moved onto the wearer's skull (TOON_HEADS), so one drawing fits
   all seven species. They are drawn over the face and brows (layer hairFront).
   后发 (back hair): long hair hanging behind the head, body and arms (layer hairBack, in head coordinates and bobbing
   with the head). Only its outline is traced from the long-hair references; it is shaded with one top-to-bottom
   gradient. A back style can only be worn together with a front style.
   Look: one ink line, flat fill in the fur colour, darker strands and cel shadow inside, no white shine. */
const HAIRS = [];
const HAIR_INDEX = {};
const HAIR_STYLES = {};
function hairDef(id, name, tags, o = {}) {
  const h = { id, name, tags, lift: o.lift || 0 };
  HAIRS.push(h); HAIR_INDEX[id] = h;
  if (o.draw) HAIR_STYLES[id] = Object.assign(h, { draw: o.draw });
}
const BACK_HAIRS = [];
const BACK_INDEX = {};
function backDef(id, name, tags, draw) { const h = { id, name, tags, draw }; BACK_HAIRS.push(h); BACK_INDEX[id] = h; }
/* under a hat that covers the head, hair above this line (head coordinates) is tucked inside the hat */
const HAIR_CUT = 150;

/* the wearer's head, for hair: skull top T, and conversions from body coordinates (for long hair) */
function hairFit(st, K) {
  const kind = headKindOf(st);
  return { kind, K, T: TOON_HEADS[kind].right[0][1] };
}
const hairInk = F => mix(F.main, F.line, .62);

/* move a point traced on the fox head onto the wearer's skull: offsets inside the skull scale with its width,
   hair beyond the skull keeps its overhang, and the crown follows the skull top */
function warpTo(H) {
  if (H.kind === 'fox') return p => p;
  const Tf = TOON_HEADS.fox.right[0][1], dT = H.T - Tf;
  return ([x, y, c]) => {
    const yy = clamp(y, Tf, 290), sf = skullX('fox', yy) - 200, sk = skullX(H.kind, yy) - 200;
    const d = x - 200, ad = Math.abs(d);
    const nd = ad <= sf ? ad * sk / sf : sk + (ad - sf);
    const ny = y < 224 ? y + dT * clamp((224 - y) / (224 - Tf), 0, 1.3) : y;
    return [r1(200 + Math.sign(d) * nd), r1(ny), c];
  };
}
/* a hand-inked stroke along a polyline: widest in the middle, tapering to points at both ends */
function taperD(pts, w) {
  const sp = samplePolyline(smoothPts(pts), 2.5, 4), n = sp.length;
  if (n < 3) return '';
  const N = normals(sp), L = [], R = [];
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1), ww = w * Math.pow(Math.sin(Math.PI * t), .6);
    L.push([sp[i].x + N[i].x * ww, sp[i].y + N[i].y * ww]); R.push([sp[i].x - N[i].x * ww, sp[i].y - N[i].y * ww]);
  }
  return smooth([[sp[0].x, sp[0].y, 1], ...L.slice(1, -1), [sp[n - 1].x, sp[n - 1].y, 1], ...R.slice(1, -1).reverse()]);
}
/* Catmull-Rom points of an open polyline (so a simplified trace bends smoothly) */
function smoothPts(pts) {
  if (pts.length < 3) return pts;
  const out = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
    for (let k = 0; k < 4; k++) {
      const t = k / 4, t2 = t * t, t3 = t2 * t;
      const f = (a, b, c, d) => .5 * (2 * b + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3);
      out.push([f(p0[0], p1[0], p2[0], p3[0]), f(p0[1], p1[1], p2[1], p3[1])]);
    }
  }
  out.push(pts[pts.length - 1]);
  return out;
}
/* x of the left- or rightmost crossing of the polygons at height y (null if none) */
function polyEdgeX(polys, y, side) {
  let best = null;
  for (const P of polys) for (let i = 0; i < P.length; i++) {
    const a = P[i], b = P[(i + 1) % P.length];
    if ((a[1] - y) * (b[1] - y) > 0 || a[1] === b[1]) continue;
    const x = a[0] + (b[0] - a[0]) * (y - a[1]) / (b[1] - a[1]);
    if (best === null || (side < 0 ? x < best : x > best)) best = x;
  }
  return best;
}
/* fur filling the gap between the hair and the side of the skull, on both sides, down to the temples */
function gapFill(H, polys, F) {
  const T = TOON_HEADS[H.kind].right[0][1] + 6;
  let d = '';
  for (const side of [-1, 1]) {
    const outer = [], inner = [];
    for (let y = T; y <= 208; y += 3) {
      const hx = polyEdgeX(polys, y, side), sk = 200 + side * (skullX(H.kind, y) - 200);
      // a tuft flaring far out from the head leaves a gap open to the background: filling it drew a flat patch of fur
      // with no outline, so only narrow gaps (hair lying close along the skull) are filled
      const gap = hx === null ? 0 : side * (hx - sk);
      if (gap <= 1.5 || gap > 12) { if (outer.length) break; continue; }
      outer.push([r1(hx - side * 1.6), y]); inner.push([r1(sk - side * 3), y]);
    }
    if (outer.length > 2) d += smooth([...outer, ...inner.reverse()].map(([x, y], i, a) => [x, y, i === 0 || i === a.length - 1 || i === outer.length - 1 || i === outer.length ? 1 : 0]));
  }
  return d ? path(d, { fill: F.main }) : '';
}

/* ---------- 前发 ---------- */
/* a traced front style: the traced silhouette with the traced shading, strand strokes and inner ink lines inside it
   (all closed shapes, so the hand-drawn taper of each stroke survives), plus optional hand-placed lines L
   (L.s strands, L.k ink lines). D.open lists edges that melt into the forehead: no outline is drawn along them. */
function tracedHair(ctx, F, H, D, L = {}, o = {}) {
  const w = warpTo(H), P = pts => pts.map(w), shapes = list => list.map(s => smooth(P(s))).join('');
  let inner = '';
  if (D.shadows) inner += path(shapes(D.shadows), shadowFill(o.shadow ?? .22));
  if (D.strands) inner += path(shapes(D.strands), { fill: hairInk(F) });
  if (D.inks) inner += path(shapes(D.inks), { fill: F.line });
  if (L.s) inner += path(L.s.map(l => taperD(P(l), o.strandW ?? 2)).join(''), { fill: hairInk(F) });
  if (L.k) inner += path(L.k.map(l => taperD(P(l), o.inkW ?? 2.1)).join(''), { fill: F.line });
  let lineMask = null;
  if (D.open) {
    const k = ctx.next('ho');
    ctx.def(k, `<mask id="__ID__" maskUnits="userSpaceOnUse" x="-100" y="-100" width="600" height="600"><rect x="-100" y="-100" width="600" height="600" fill="#fff"/>${D.open.map(l => `<path d="${smooth(P(l), false)}" fill="none" stroke="#000" stroke-width="9" stroke-linecap="round"/>`).join('')}</mask>`);
    lineMask = ctx.url(k);
  }
  // where the hair stands off the side of the skull (the reference heads are rounder than ours), fill the gap
  // underneath with fur so the hair sits on the head instead of floating over the ears
  const fillUnder = o.fillGap === false ? '' : gapFill(H, D.outer.map(P), F);
  return fillUnder + D.outer.map(pts => {
    const sid = ctx.shape(smooth(P(pts)));
    return g(use(sid, { fill: F.main }) + inner, { 'clip-path': ctx.clipUse(sid) })
      + use(sid, Object.assign({ fill: 'none', stroke: F.line, 'stroke-width': 2.6, 'stroke-linejoin': 'round' }, lineMask ? { mask: lineMask } : {}));
  }).join('');
}

/* ---------- 后发 ---------- */
/* traced (fox, girl) coordinates -> the wearer: around the head follow the skull, below the neck follow the body width */
function warpBack(H) {
  const sk = warpTo(H), K = H.K;
  const kBody = (Math.max(K.hi, K.ch) + K.arm + 24) / 84;           // how far out the hanging arms are, vs the girl body
  return ([x, y, c]) => {
    const a = sk([x, y, c]), wHead = clamp((250 - y) / 40, 0, 1);
    const f = lerp(1, kBody, clamp((y - 240) / 80, 0, 1));
    return [r1(lerp(200 + (x - 200) * f, a[0], wHead)), r1(lerp(y, a[1], wHead)), c];
  };
}
/* the skull cap of the back hair: a dome behind the head that meets the traced sheet where the sheet's (cut-off)
   top begins, exactly as wide as the sheet there, its sides running down into the sheet */
const BACK_TOP = 205, BACK_JOIN = 212;
function backCap(H, polys) {
  const T = TOON_HEADS[H.kind].right[0][1] - 7;
  let half = 0;
  for (const y of [BACK_TOP + 1, (BACK_TOP + BACK_JOIN) / 2, BACK_JOIN]) for (const sd of [-1, 1]) { const x = polyEdgeX(polys, y, sd); if (x !== null) half = Math.max(half, Math.abs(x - 200)); }
  half = Math.max(half, skullX(H.kind, BACK_JOIN) - 200 + 8);
  // the sheet flares out below the head: if the dome stayed as narrow as the sheet's top, the hair's outer edge
  // curved in to the cheek with a notch under the front hair. So the dome is as wide as the sheet gets just below
  // (per side), and each side runs straight down until it meets the sheet
  const side = sd => { let w = half, yMeet = BACK_JOIN + 12;
    for (let y = BACK_JOIN; y <= 262; y += 3) { const x = polyEdgeX(polys, y, sd); if (x === null) continue; const ww = Math.abs(x - 200);
      if (ww > w) { w = ww; yMeet = y + 4; } }
    return { w, yMeet }; };
  const L = side(-1), R = side(1);
  const b = BACK_JOIN - T, pts = [];
  for (let i = 0; i <= 16; i++) { const a = Math.PI * i / 16, w = i < 8 ? L.w : i > 8 ? R.w : (L.w + R.w) / 2; pts.push([r1(200 - Math.cos(a) * w), r1(BACK_JOIN - Math.sin(a) * b)]); }
  return smooth([[r1(200 - L.w), L.yMeet, 1], ...pts, [r1(200 + R.w), R.yMeet, 1], [r1(200 + R.w - 14), R.yMeet + 10, 1], [r1(200 - L.w + 14), L.yMeet + 10, 1]]);
}

/* the back hair: the traced sheet (its flat cut-off top hidden under the skull cap) and the cap, filled as one shape
   (outlines under the fills, so no seam shows). It is behind the head and body, so all of it is in shadow: the
   colour multiplied by the shadow lilac once (worked out here, as the hair is one flat colour); towards the
   middle, behind the body, it deepens to a second multiply:
   darkest in the middle, lighter towards the outer edges */
function tracedBack(ctx, F, H, D) {
  const w = warpBack(H);
  const polys = D.outer.map(p => p.map(w));
  const sheet = polys.map(p => smooth(p)), cap = backCap(H, polys);

function sideFolds(K, hem = 466, k = 1) {
  const one = (s, depth) => {
    const X = x => r1(CX + s * x), a = K.ch - 1, b = K.ch + 2;
    return path(`M${X(a)},356Q${X(a - 13)},384 ${X(a - 20)},${416}Q${X(a - 9)},388 ${X(a)},356Z`, shadowFill(depth * k))
      + path(`M${X(b)},402Q${X(b - 16)},${(402 + hem) / 2 + 4} ${X(b - 30)},${hem - 6}Q${X(b - 12)},${(402 + hem) / 2 - 2} ${X(b)},402Z`, shadowFill(depth * .9 * k));
  };
  return one(1, .1) + one(-1, .06);
}
function buttons(xs, ys, col, r = 2.6) {
  let s = '';
  for (const y of ys) for (const x of xs) s += circ(x, y, r, { fill: col, stroke: lineOf(col), 'stroke-width': 1.2 });
  return s;
}
function pocket(x, y, w, h, col, o = {}) {
  const lc = lineOf(col);
  let s = path(`M${x},${y}h${w}v${h - 4}q0,4 -4,4h${-(w - 8)}q-4,0 -4,-4z`, { fill: o.fill || 'none', stroke: lc, 'stroke-width': 1.8, 'stroke-linejoin': 'round' });
  if (o.pleat) s += ln(`M${x + w / 2 - 3},${y + 6}V${y + h - 1}M${x + w / 2 + 3},${y + 6}V${y + h - 1}`, lc, 1.1, { opacity: .45 });
  // the flap lies on the pocket: a thin cast shadow under it
  if (o.flap) s += path(`M${x - 1},${y - 1}h${w + 2}v7q-${(w + 2) / 2},5 -${w + 2},0z`, shadowFill(.14, { transform: 'translate(1,2.2)' }))
    + path(`M${x - 1},${y - 1}h${w + 2}v7q-${(w + 2) / 2},5 -${w + 2},0z`, { fill: o.flapFill || col, stroke: lc, 'stroke-width': 1.8, 'stroke-linejoin': 'round' })
    + (o.flapButton ? circ(x + w / 2, y + 6.5, 2.8, { fill: o.flapButton, stroke: lineOf(o.flapButton), 'stroke-width': 1.1 }) : circ(x + w / 2, y + 6, 1.6, { fill: lc }));
  if (o.stitch) s += stitch(`M${x + 2.5},${y + 2.5}v${h - 6}M${x + w - 2.5},${y + 2.5}v${h - 6}`, o.stitch, 1.1);
  return s;
}

/* ===== wear_tops.js — tops ===== */
function crewRib(K, col, depth = 306) {
  const w = K.neck + 3;
  return ln(`M${CX - w},297Q${CX},${depth + 8} ${CX + w},297`, shadeOf(col, .12), 5) + ln(`M${CX - w - 1},299Q${CX},${depth + 12} ${CX + w + 1},299`, lineOf(col), 1.4, { opacity: .6 });
}
function ribBand(K, y0, y1, col, half = 120) {
  let s = path(`M${CX - half},${y0}H${CX + half}V${y1}H${CX - half}Z`, { fill: shadeOf(col, .1) });
  let d = '';
  for (let x = CX - half; x <= CX + half; x += 5) d += `M${x},${y0 + 1}V${y1 - 1}`;
  return s + ln(d, lineOf(col), 1, { opacity: .35 }) + ln(`M${CX - half},${y0}H${CX + half}`, lineOf(col), 1.6, { opacity: .7 });
}
function placket(K, y0, y1, col, n = 4, x = CX, o = {}) {
  const lc = lineOf(col), bc = o.button || lighten(col, .55);
  let s = ln(`M${x - 4},${y0}V${y1}M${x + 4},${y0}V${y1}`, lc, 1.3, { opacity: .55 });
  for (let i = 0; i < n; i++) s += circ(x, y0 + 10 + i * (y1 - y0 - 14) / Math.max(1, n - 1), o.r || 2.3, { fill: bc, stroke: o.button ? lineOf(bc) : lc, 'stroke-width': 1.1 });
  return s;
}

function jacketPanel(K, o = {}) {
  const e = o.ease ?? 7, hem = o.hem ?? 474, fl = o.flare ?? 0;
  const hw = Math.max(K.hi, K.wa, K.ch - 2) + e;
  const pts = [[CX + K.neck + 5, 293, 1], [CX + K.sh - 11, 301], [CX + K.sh + 2, 309.5], [CX + K.sh, 328], [CX + K.ch + e + 1, 350], [CX + K.ch + e, 372],
    [CX + Math.max(K.wa, K.ch - 6) + e + 1, 412], [CX + Math.max(K.hi, K.wa) + e + fl * .5, 456]];
  if (hem > 470) pts.push([CX + hw + fl * .8, (456 + hem) / 2]);
  pts.push([CX + hw + fl + 1, hem, 1]);
  if (o.cutaway) pts.push([CX + o.gapHem, hem + 1, 1], [CX + 3, o.closeAt + 14], [CX + 1, o.closeAt, 1]);
  else if (o.closeAt) pts.push([CX - (o.overlap ?? 6), hem + 1, 1], [CX - (o.overlap ?? 6), o.closeAt, 1]);
  else pts.push([CX + (o.gapHem ?? 18), hem + 1, 1]);
  pts.push([CX + (o.gapMid ?? 12), o.vEnd ?? 352, o.closeAt ? 1 : 0]);
  return pts;
}
function jacket(env, it, o = {}) {
  const { K, ctx } = env;
  const R = jacketPanel(K, o);
  const col = o.col || it.c1;
  const dR = smooth(R), dL = smooth(mirAll(R));
  const folds = o.folds === false ? '' : sideFolds(K, o.hem ?? 474, .8);
  const right = paint(ctx, dR, col, { pat: it.patUrl, extra: (o.extraR || '') + folds });
  const left = paint(ctx, dL, col, { pat: it.patUrl, extra: (o.extraL || '') + folds });
  // the panels shade the shirt in the opening and the hips under the hem
  const cast = env.castOnTop ? dropShadow(dR + dL, env.castOnTop, .14, 2, 2.8) : '';
  return cast + (o.leftOver ? right + left : left + right);
}
/* a closed coat painted panel by panel: the cast shadow of both panels on the shirt / trousers under it */
const panelsCast = (env, R) => env.castOnTop ? dropShadow(smooth(R) + smooth(mirAll(R)), env.castOnTop, .14, 2, 2.8) : '';
function lapels(K, col, o = {}) {
  const roll = o.roll ?? 398, notch = o.notch ?? 320, w = o.w ?? 38, lc = lineOf(col);
  const right = [[CX + K.neck + 4, 290, 1], [CX + K.neck + 15, 297], [CX + w - 5, notch - 7, 1], [CX + w - 10, notch + 1, 1], [CX + w + 1.5, notch + 2.5, 1], [CX + w - 2, notch + 22],
    [CX + 3, roll, 1], [CX + K.neck + 4, 305]];
  const gorge = s => { const X = x => CX + s * (x - CX); return ln(`M${r1(X(CX + w - 10))},${notch + 1}L${r1(X(CX + K.neck + 9))},${302}`, lc, 1.4, { opacity: .7 }); };
  const one = (pts, s, lit) => { const d = smooth(pts);
    return path(d, shadowFill(.2, { transform: 'translate(2,2.6)' })) + flat(d, lighten(col, .04), lc, 2.5) + gorge(s)
      + ln(smooth(pts.slice(4, 7), false), lighten(col, .3), 1.5, { opacity: lit, transform: `translate(${-s * 2.2},0)` }); };
  return one(right, 1, .3) + one(mirAll(right), -1, .65);

function flatCollar(K, col, o = {}) {
  const lc = lineOf(col), w = o.w ?? 30, d = o.depth ?? 330;
  const right = [[CX + K.neck + 2, 286], [CX + K.neck + 26, 296], [CX + K.sh - 2, 312], [CX + w + 4, d, 1], [CX + 13, d - 18], [CX + K.neck + 4, 300]];

/* scale an absolute path (as smooth() writes it) about a point; patterns stay in register with the leg */

  return d.replace(/(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/g, (m, x, y) => `${r1(cx + (x - cx) * k)},${r1(cy + (y - cy) * k)}`);

  let s = '';

    const F = shod ? null : sockFoot(K, sd), fid = F ? ctx.shape(F.d) : null;

/* ---------- shoes ---------- */
/* Frame of one shoe: centred on the paw, wide enough to hold it, but always leaving a gap between the two shoes.
   o(d): x of an offset d from the centre line on this side (mirrors with the foot) — for construction lines.
   L(u): screen x relative to the shoe centre (does NOT mirror) — for light: highlights and shadows. */
function shoeFrame(K, sd) {
  const a = K.ac, c = a + 1;
  const hw = Math.min(c - 2, K.aw + 13);
  const cx = CX + sd * c;
  return { sd, K, a, c, hw, aw: K.aw, cx, o: d => CX + sd * d, L: u => cx + u };
}

   dip: how far the throat (opening) dips in the middle. */

  else { inT = a - aw - (o.ankle ?? 2.5); outT = a + aw + (o.ankle ?? 2.5); }

/* ===== wear_head.js — hats, glasses, face stickers ===== */
const hp = (env, it, d, o = {}) => paint(env.ctx, d, o.col || it.c1, { pat: o.noPat ? null : it.patUrl, shade: o.shade || 'rad', extra: o.extra, sw: o.sw ?? 2.6 });

/* ---------- fitting hats to the head ----------
   Every species has its own cranium (TOON_HEADS), so hats are built from that outline instead of fixed numbers.
   Light comes from the upper left like everywhere else: cel shadow on the right and under edges, a lighter tone
   (never white) on matte tops, white specular only on shiny bits such as a metal buckle. */
function hatFit(st) {
  const kind = headKindOf(st);
  return { kind, T: TOON_HEADS[kind].right[0][1] - .8, W: y => craniumX(kind, y) - 200, arc: (y0, t) => craniumArc(kind, y0, t), headD: toonHeadPath(kind, '_hat', []) };
}
/* closed shape from an arc (left end -> right end) and the points of its lower edge (right -> left) */
const arcShape = (arc, lower = []) => smooth([[...arc[0], 1], ...arc.slice(1, -1), [...arc[arc.length - 1], 1], ...lower]);
/* meridian (a seam or knit rib) over a dome: the right half of its arc squeezed towards the centre line */
function meridian(arc, u) {
  const half = arc.slice((arc.length - 1) / 2);
  return smooth(half.map(([x, y]) => [r1(200 + (x - 200) * u), y]), false);
}
const hatShade = celShade, hatLit = celLit;
/* one hat part: fill (+ pattern), details and light clipped inside, then the ink line */
function hatPart(ctx, d, col, o = {}) {
  const sid = ctx.shape(d);
  let s = use(sid, { fill: col });
  if (o.pat) s += use(sid, { fill: o.pat });
  let inner = o.extra || '';
  if (o.lit) inner += hatLit(ctx, d, ...o.lit);
  if (o.shade !== false) inner += hatShade(ctx, d, ...(o.shade || []));
  if (o.after) inner += o.after;
  if (inner) s = g(s + inner, { 'clip-path': ctx.clipUse(sid) });
  return s + use(sid, { fill: 'none', stroke: o.line || lineOf(col), 'stroke-width': o.sw ?? 2.6, 'stroke-linejoin': 'round' });
}
/* soft shadow the hat casts on the face, just under its front edge (edge points left -> right), kept inside the head */
function browShadow(ctx, H, edge, depth = 7, op = .13) {
  const lo = edge.slice().reverse().map(([x, y]) => [x + 2, y + depth]);
  const d = smooth([[...edge[0], 1], ...edge.slice(1, -1), [...edge[edge.length - 1], 1], [...lo[0], 1], ...lo.slice(1, -1), [...lo[lo.length - 1], 1]]);
  return path(d, shadowFill(op, { 'clip-path': ctx.clip(H.headD) }));
}
/* an edge that bows by `bow` at the centre between x0 and x1 (bow < 0: the centre is higher) */
const bowEdge = (x0, x1, y, bow, n = 6) => Array.from({ length: n + 1 }, (_, i) => { const u = i / n, x = lerp(x0, x1, u), v = (u - .5) * 2; return [r1(x), r1(y + bow * (1 - v * v))]; });
/* flat brim seen slightly from above: back edge, rounded ends, front edge dipping by `dip` */
function brimPts(cx, y, w, back, front, endDrop = 2) {
  return [[cx - w, y + endDrop], [cx - w * .72, y - back * .72], [cx, y - back], [cx + w * .72, y - back * .72], [cx + w, y + endDrop],
    [cx + w * .74, y + front * .62], [cx, y + front], [cx - w * .74, y + front * .62]];
}

function wing(s, kind, col) {
  const X = x => s > 0 ? x : mirX(x);
  if (kind === 'angel') {
    let out = '';
    const lc = mix(lineOf(col), '#b9a6d9', .5);
    const feather = (ax, ay, ang, L, w, c) => {
      const d = `M0,${-w / 2}Q${L * .62},${-w * .72} ${L},0Q${L * .62},${w * .72} 0,${w / 2}Z`;
      return path(d, { fill: c, stroke: lc, 'stroke-width': 1.6, 'stroke-linejoin': 'round', transform: `translate(${r1(X(ax))},${ay}) rotate(${s > 0 ? ang : 180 - ang})` });
    };
    const rows = [[-52, 34, 8, 132, 30, '#efe8fb'], [-44, 26, 7, 96, 32, '#f8f4ff'], [-36, 16, 6, 60, 34, '#ffffff']];
    rows.forEach(([a0, a1, n, L, w, c], ri) => {
      for (let i = 0; i < n; i++) { const t = i / (n - 1); out += feather(236 + ri * 6, 312 + ri * 4 + t * 26, lerp(a0, a1, t), L * (1 - .22 * t), w, mix(c, col, .5)); }
    });
    return out;
  }
  if (kind === 'devil') {
    const pts = [[X(236), 310], [X(300), 250, 1], [X(372), 232, 1], [X(356), 286, 1], [X(338), 272], [X(330), 322, 1], [X(310), 306], [X(296), 352, 1], [X(278), 334], [X(250), 370]];
    return flat(smooth(pts), col, lineOf(col), 2.4) + ln(`M${X(300)},252L${X(338)},272M${X(300)},252L${X(310)},306M${X(300)},252L${X(278)},334`, lighten(col, .3), 1.6, { opacity: .7 });
  }
  if (kind === 'fairy') {
    const up = [[X(232), 320], [X(276), 236], [X(340), 214], [X(368), 250], [X(340), 300], [X(268), 330]];
    const lo = [[X(232), 336], [X(300), 352], [X(330), 396], [X(300), 424], [X(262), 398]];

/* ===== music.js — background music: a bossa nova loop synthesized live with Web Audio (no audio files) =====
   16 bars at 126 bpm (~30 s): electric piano comping the classic bossa rhythm, a plucked melody that varies from
   one pass to the next, bass on root and fifth, shaker, rim clicks on the bossa clave and a soft kick.
   BGM.start(ac) begins (or resumes) playback on a shared AudioContext; BGM.stop() fades out; BGM.duck() dips the

   keep time; when the page is hidden the music fades out and picks up again when it is shown. */

    Em7b5: [40, [62, 64, 67, 70]], A7: [45, [61, 64, 67, 71]], Dm7: [50, [65, 69, 72, 76]],
  };

  const PROG = [['Fmaj7'], ['Fmaj7'], ['G7'], ['G7'], ['Gm7'], ['C7'], ['Fmaj7'], ['Em7b5', 'A7'],
    ['Dm7'], ['D7'], ['Gm7'], ['C7'], ['Bbmaj7'], ['Bbm6'], ['Am7', 'D7'], ['Gm7', 'C7']];
  const SCALE = [0, 2, 4, 5, 7, 9, 11].map(x => x + 65);   // F major from F4

  const CLAVE = [[0, 0], [0, 1.5], [0, 3], [1, 1], [1, 2.5]];        // 3-2 clave over two bars: [bar parity, beat]

/* ===== i18n.js — language pick, L() lookup, in-place localisation of the data tables =====
Text is looked up by its Chinese original. I18N_PACK (generated by tools/i18n.cjs into src/lang.js) holds
zh: {key: 中文} and one {key: text} per language; the keys are short hashes of the Chinese text, the same keys
the AIWANNA platform serves at /i18n/<slug>/<lang>.json, so lines the author edits there are layered on top. */
const LANGS = ['zh', 'en', 'ja', 'ko', 'es'];
const PLATFORM_SLUG = 'game-07c6bf44eb23be51';
const LANG = (() => {
  const norm = v => {
    v = String(v || '').toLowerCase();
    if (!v) return '';
    if (v.startsWith('zh')) return 'zh';
    const p = v.split(/[-_]/)[0];
    return LANGS.includes(p) ? p : '';
  };
  let q = '';
  try { q = new URLSearchParams(location.search).get('lang') || ''; } catch (e) { /* no URL */ }
  if (q && norm(q)) return norm(q);
  if (/HeadlessChrome/.test(navigator.userAgent)) return 'zh';
  for (const l of (navigator.languages || [navigator.language])) { const n = norm(l); if (n) return n; }
  return 'en';
})();
const LIST_SEP = { zh: '、', ja: '、' }[LANG] || ', ';
const DICT = {};
function buildDict(over) {
  const zh = I18N_PACK.zh, tr = Object.assign({}, I18N_PACK[LANG] || {}, over || {});
  for (const k in zh) if (tr[k]) DICT[zh[k]] = tr[k];
}
if (LANG !== 'zh') buildDict();
/* L('换上了「{0}」', name): translated text with {0}, {1}… filled in */
function L(s, ...a) {
  const r = (LANG !== 'zh' && DICT[s]) || s;
  return a.length ? r.replace(/\{(\d+)\}/g, (m, i) => (a[i] !== undefined ? a[i] : m)) : r;
}
/* translate a field in place, remembering the original so it can be redone after the platform overlay */
const ZH = new WeakMap();
function trField(o, f) {
  if (!o || typeof o[f] !== 'string') return;
  let z = ZH.get(o); if (!z) ZH.set(o, z = {});
  if (!(f in z)) z[f] = o[f];
  o[f] = L(z[f]);

function trDeep(v, fields) {

function trPage() {
  document.documentElement.lang = { zh: 'zh-CN', en: 'en', ja: 'ja', ko: 'ko', es: 'es' }[LANG];
  if (!ZH_NODES.has(document)) ZH_NODES.set(document, document.title);
  document.title = L(ZH_NODES.get(document));
  const w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
  for (let n = w.nextNode(); n; n = w.nextNode()) {
    const t = n.nodeValue.trim(); if (!t) continue;
    if (!ZH_NODES.has(n)) ZH_NODES.set(n, t);
    n.nodeValue = L(ZH_NODES.get(n));

    let z = ZH_NODES.get(el); if (!z) ZH_NODES.set(el, z = { title: el.getAttribute('title'), aria: el.getAttribute('aria-label') });

function loadPlatformText(done) {

/* ---------- actions ---------- */
function selectTile(id) {

    if (!id) { if (!S.wear[slot]) return; commit(s => { delete s.wear[slot]; }, { fx: slot }); play('swish'); return; }
    if (S.wear[slot] && S.wear[slot].id === id && !hiddenByDress(slot)) { play('tap'); return; }
    commit(s => {
      if (s.wear[slot] && s.wear[slot].id !== id) remember(s, slot);
      s.wear[slot] = s.wear[slot] && s.wear[slot].id === id ? s.wear[slot] : currentItemState(slot, id);
      if ((slot === 'top' || slot === 'bottom') && s.wear.dress && !(slot === 'top' && ITEM_INDEX.dress[s.wear.dress.id].overTop)) delete s.wear.dress;
      if (slot === 'dress' && ITEM_INDEX.dress[id].overTop && !s.wear.top) s.wear.top = { id: 'blouse' };
    }, { fx: slot });
    UI.target = 'c1';
    play('pop'); buzz();
    return;
  }
  switch (UI.cat) {
    case 'species': if (S.species === id) return; commit(s => { const p = palOf(id, 0); renameFor(s, id); s.species = id; s.palIdx = 0; s.fur = p; s.hair.color = p.hair; s.eyes.color = p.eye; }, { fx: 'species' }); break;
    case 'fur': commit(s => { const p = palOf(s.species, +id); s.palIdx = +id; s.fur = p; s.hair.color = p.hair; s.eyes.color = p.eye; }, { fx: 'fur' }); break;
    case 'body': if (S.body === id) return; commit(s => { s.body = id; if (id === 'boy' && s.eyes.style === 'sparkle') s.eyes.style = 'boy'; if (id === 'girl' && s.eyes.style === 'boy') s.eyes.style = 'sparkle'; }, { fx: 'body' }); break;
    case 'eyes': commit(s => { s.eyes.style = id; }, { fx: 'eyes' }); break;
    case 'expr': commit(s => { s.expr = id; }, { fx: 'expr' }); break;
    case 'hair': commit(s => { s.hair.id = id; if (id === 'none') s.backHair = { id: 'none' }; }, { fx: 'hair' }); break;
    case 'backHair':
      if (id !== 'none' && S.hair.id === 'none') { toast(L('先选一款前发，才能搭配后发')); play('tap'); return; }
      if (S.backHair.id === id) { play('tap'); return; }
      commit(s => { s.backHair = { id }; }, { fx: 'backHair' }); break;

    case 'bg': commit(s => { s.bg = id; }); break;

    s.expr = pick(EXPRESSIONS).id;
    const hairs = HAIRS.filter(h => h.id !== 'none' && (h.tags.includes(style.tag) || chance(.2)));

    const backs = BACK_HAIRS.filter(h => h.id !== 'none' && (h.tags.includes(style.tag) || chance(.25)));
    s.backHair = { id: s.hair.id !== 'none' && backs.length && chance(.4) ? pick(backs).id : 'none' };

function chroma(hex) { const [h, s, l] = toHsl(hex); return { h, c: s * (1 - Math.abs(2 * l - 1)) }; }

  for (const h of hues) { if (!clusters.some(c => Math.min(Math.abs(c - h), 360 - Math.abs(c - h)) < 32)) clusters.push(h); }

}
function visibleWear() {
  const out = [];

    const def = ITEM_INDEX[slot][w.id]; if (!def) continue;
    if (slot === 'top' && S.wear.dress && !ITEM_INDEX.dress[S.wear.dress.id].overTop) continue;

}

    if (x.def.tags.some(tg => t.avoid.includes(tg))) s -= 3;
    x.s = s;
    if (s >= 3) good.push(x); else if (s < 0) bad.push(x);
    fit += clamp(s, -3, 6);
  }
  const hair = HAIR_INDEX[S.hair.id];
  if (hair && hair.tags.some(tg => t.want[tg])) fit += 2;
  const back = S.hair.id !== 'none' && BACK_INDEX[S.backHair.id];
  if (back && back.tags.some(tg => t.want[tg])) fit += 1;
  const fitN = clamp(fit / 24, 0, 1);
  const hasOutfit = !!(S.wear.dress || (S.wear.top && S.wear.bottom));
  const accN = ['hat', 'glasses', 'neck', 'acc', 'held', 'back', 'face'].filter(k => S.wear[k]).length;
  const complete = clamp((hasOutfit ? .45 : .12) + (S.wear.shoes ? .25 : 0) + Math.min(accN, 3) * .1, 0, 1);
  const harm = harmony(items.map(x => x.it.c1));

  const flair = clamp((accN + (S.wear.outer ? 1 : 0)) / 5, 0, 1);
  const total = Math.round(100 * (.5 * fitN + .17 * harm + .18 * complete + .15 * sceneOk));
  return { total, fitN, harm, complete, sceneOk, flair, good, bad, items, accN, hasOutfit };
}

function composeSVG(W, H) {
  const bg = renderScene(S.bg, 'xp', { noAnim: true }).replace('<svg ', `<svg x="0" y="0" width="${W}" height="${H}" `);
  const ch = H * .94, cw = ch * 400 / 720;
  const chr = renderCharacter(S, { id: 'xp', noAnim: true }).replace('<svg ', `<svg x="${(W - cw) / 2}" y="${H - ch - H * .01}" width="${cw}" height="${ch}" `);
  const shadow = `<ellipse cx="${W / 2}" cy="${H * .985}" rx="${W * .2}" ry="${H * .028}" fill="#2b143c" opacity=".22"/>`;
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${bg}${shadow}${chr}</svg>`;
}
function loadImg(src) { return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; }); }
async function makePhoto(name) {
  const PW = 900, PH = 1080, M = 54, CAP = 190;
  const cv = document.createElement('canvas');
  cv.width = PW + M * 2; cv.height = PH + M + CAP;
  const c = cv.getContext('2d');
  c.fillStyle = '#fffdf8'; c.fillRect(0, 0, cv.width, cv.height);
  const img = await loadImg('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(composeSVG(PW, PH)));

  c.strokeStyle = 'rgba(59,33,80,.12)'; c.lineWidth = 2; c.strokeRect(M, M, PW, PH);
  try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch (e) { /* ignore */ }
  c.fillStyle = '#3b2150'; c.textAlign = 'center';
  c.font = '64px "ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",sans-serif';
  c.fillText(name || L('绒绒'), cv.width / 2, PH + M + 92);
  const d = new Date();
  c.font = '30px "ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",sans-serif';
  c.fillStyle = '#8a7399';
  const sub = (UI.challenge ? UI.challenge.name + '  ·  ' : '') + `${L('绒绒时装屋')}  ${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
  c.fillText(sub, cv.width / 2, PH + M + 144);
  return cv.toDataURL('image/png');
}

  $('#modal').onclick = e => {
    if (e.target.id === 'modal' || e.target.closest('[data-close]')) { closeModal(); return; }
    const pr = e.target.closest('[data-preset]'); if (pr) { applyPreset(+pr.dataset.preset); return; }
    if (e.target.closest('[data-reroll]')) { openChallenge(); return; }
    if (e.target.closest('[data-start]')) { startChallenge(); return; }
    if (e.target.closest('[data-next]')) { closeModal(); openChallenge(); return; }
    if (e.target.closest('[data-photo]')) { closeModal(); openPhoto(); return; }
    if (e.target.closest('[data-dl]')) { downloadPhoto(); return; }
  };
  let nameT = 0;
  $('#modal').addEventListener('input', e => { if (e.target.id === 'nm') { S.name = e.target.value.slice(0, 12); save(); clearTimeout(nameT); nameT = setTimeout(refreshPhoto, 350); } });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !$('#modal').hidden) closeModal();
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && $('#modal').hidden) { e.preventDefault(); undo(); }
  });
  /* unlock audio on the first real gesture. Browsers differ in which events count (Safari ignores pointerdown,
     a key press counts too), and a context created on an event that doesn't count stays suspended: so keep
     listening on all of them until the context is actually running, and start the music then */
  const UNLOCK = ['pointerdown', 'pointerup', 'click', 'touchend', 'keydown'];
  const unlock = () => {
    const a = ac(); if (!a) return;
    if (UI.music) music(true);
    const done = () => { if (a.state === 'running') UNLOCK.forEach(ev => document.removeEventListener(ev, unlock, true)); };
    done(); if (a.resume) a.resume().then(done, () => {});
  };
  UNLOCK.forEach(ev => document.addEventListener(ev, unlock, true));
}
